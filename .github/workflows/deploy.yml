name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # Served from the root of the custom subdomain (see public/CNAME).
          BASE_PATH: /
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: pages
        uses: actions/deploy-pages@v5
