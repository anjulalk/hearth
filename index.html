    <!-- Set the appearance before first paint so the dark theme never flashes. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('hearth.appearance')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>

    <noscript>
      <h1>hearth: keep the screen on while agents run</h1>
      <p>
        hearth asks the browser to hold a screen wake lock and to keep a quiet media stream alive,
        so a long-running job in another tab never wakes up to a display that has gone to sleep. It
        also shows a black screensaver with a clock, an ember, a star field or a tally of the agents
        at work. The holds and the screensaver both need JavaScript; enable it to use hearth.
